name: Validate npm-release skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Check script syntax
        run: node --check skills/npm-release/scripts/inspect-tarball.mjs
      - name: Run isolated tests
        run: node --test tests/*.test.mjs
      - name: Ensure distributed ZIP matches source files
        run: |
          unzip -t npm-release-skill.zip
          unzip -p npm-release-skill.zip npm-release/SKILL.md | cmp - skills/npm-release/SKILL.md
          unzip -p npm-release-skill.zip npm-release/scripts/inspect-tarball.mjs | cmp - skills/npm-release/scripts/inspect-tarball.mjs
